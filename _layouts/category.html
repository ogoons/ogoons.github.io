---
layout: default
---
<div class="post-container">
  <h1 class="post-title category-title">{{ page.title | escape }}</h1>
  <ul class="category-posts" style="list-style: none; margin: 0; padding: 0;">
    {%- assign posts = site.categories[page.category] | sort: "date" | reverse -%}
    {%- for post in posts -%}
      <li style="list-style: none;">
        <a class="post-link" href="{{ post.url | relative_url }}">
          <h2 class="post-title">{{ post.title | escape }}</h2>
        </a>
        <div class="post-meta">
          <div class="post-date"><i class="icon-calendar"></i>{{ post.date | date: "%Y-%m-%d" }}</div>
        </div>
      </li>
    {%- endfor -%}
  </ul>
</div>
<script>
  if (window.innerWidth <= 768) {
    history.scrollRestoration = 'manual';
    window.addEventListener('load', function () {
      document.querySelector('.post-container').scrollIntoView({ block: 'start' });
    });
  }
</script>
